name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare signing key
        run: mkdir -p $HOME/.android; if [ -f app.keystore ]; then cp app.keystore $HOME/.android/debug.keystore; echo USING_REPO_KEY; else keytool -genkeypair -v -keystore $HOME/.android/debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android, O=Android"; cp $HOME/.android/debug.keystore generated-key.keystore; echo GENERATED_NEW_KEY; fi

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Sync web assets
        run: npx cap sync android

      - name: Add FileSaver plugin
        run: if [ -f android-extra/FileSaverPlugin.java ]; then mkdir -p android/app/src/main/java/com/evilnote/filesaver; cp android-extra/FileSaverPlugin.java android/app/src/main/java/com/evilnote/filesaver/; find android/app/src/main/java -name MainActivity.java -exec sed -i 's/extends BridgeActivity {}/extends BridgeActivity { @Override public void onCreate(android.os.Bundle b) { registerPlugin(com.evilnote.filesaver.FileSaverPlugin.class); super.onCreate(b); } }/' {} \;; echo FILESAVER_ADDED; fi

      - name: Set custom app icon
        run: if [ -f icon.png ]; then rm -rf android/app/src/main/res/mipmap-anydpi-v26; rm -f android/app/src/main/res/mipmap-mdpi/ic_launcher.png android/app/src/main/res/mipmap-hdpi/ic_launcher.png android/app/src/main/res/mipmap-xhdpi/ic_launcher.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png android/app/src/main/res/mipmap-mdpi/ic_launcher_round.png android/app/src/main/res/mipmap-hdpi/ic_launcher_round.png android/app/src/main/res/mipmap-xhdpi/ic_launcher_round.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png; cp icon.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png; cp icon.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png; echo CUSTOM_ICON_APPLIED; else echo ICON_NOT_FOUND; fi

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: cd android && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: evilnote-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload signing key (save it once)
        if: ${{ !hashFiles('app.keystore') }}
        uses: actions/upload-artifact@v4
        with:
          name: keystore-save-once
          path: generated-key.keystore
